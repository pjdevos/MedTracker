<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>MyPillbox</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f7f6;
      --white: #ffffff;
      --green: #3dae7c;
      --green-light: #eaf7f1;
      --green-mid: #c2ead7;
      --orange: #f59b2b;
      --orange-light: #fff4e0;
      --red: #e05252;
      --red-light: #fdeaea;
      --text: #1a1a1a;
      --muted: #9aacaa;
      --border: #ebebeb;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--white);
      padding: 16px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-right { display: flex; align-items: center; gap: 8px; }

    .avatar {
      width: 38px; height: 38px;
      background: var(--green-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .lang-toggle {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 2px;
      gap: 2px;
    }

    .lang-btn {
      background: none;
      border: none;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.15s;
    }

    .lang-btn.active {
      background: var(--white);
      color: var(--green);
      box-shadow: 0 1px 4px rgba(0,0,0,0.10);
    }

    .date-chip {
      background: var(--green-light);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
    }

    main {
      padding: 20px 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .add-card {
      background: var(--white);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .add-card .section-title { margin-bottom: 16px; }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    input {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 11px 14px;
      width: 100%;
      outline: none;
      transition: border-color 0.18s;
    }

    input:focus { border-color: var(--green); background: var(--white); }
    input::placeholder { color: var(--muted); font-weight: 500; }

    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-row { margin-bottom: 12px; }

    .btn-add {
      width: 100%;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    .btn-add:active { transform: scale(0.98); background: #35a070; }

    .med-list { display: flex; flex-direction: column; gap: 10px; }

    .med-card {
      background: var(--white);
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 14px;
      animation: fadeUp 0.22s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .med-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      background: var(--green-light);
    }

    .med-card.warn .med-icon { background: var(--orange-light); }
    .med-card.danger .med-icon { background: var(--red-light); }

    .med-body { flex: 1; min-width: 0; }

    .med-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .med-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .med-sub .highlight { color: var(--green); }
    .med-card.warn .med-sub .highlight { color: var(--orange); }
    .med-card.danger .med-sub .highlight { color: var(--red); }

    .progress {
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--green);
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .med-card.warn .progress-bar { background: var(--orange); }
    .med-card.danger .progress-bar { background: var(--red); }

    .med-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .dose-badge {
      background: var(--green-light);
      color: var(--green);
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.2;
      min-width: 52px;
      text-align: center;
    }

    .med-card.warn .dose-badge { background: var(--orange-light); color: var(--orange); }
    .med-card.danger .dose-badge { background: var(--red-light); color: var(--red); }

    .dose-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-actions { display: flex; gap: 5px; }

    .btn-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 15px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      font-weight: 700;
    }

    .btn-icon:active { transform: scale(0.9); }
    .btn-icon.plus:hover { border-color: var(--green); color: var(--green); background: var(--green-light); }
    .btn-icon.minus:hover { border-color: #ccc; color: #555; }
    .btn-icon.del:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }

    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }

    .empty-icon { font-size: 52px; display: block; margin-bottom: 12px; opacity: 0.5; }

    .empty p { font-size: 14px; font-weight: 600; line-height: 1.7; }

    .install-banner {
      background: var(--green-light);
      border: 1.5px solid var(--green-mid);
      border-radius: 16px;
      padding: 13px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .install-banner.hidden { display: none; }
    .install-banner span { flex: 1; }
    .btn-install {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      cursor: pointer;
    }
    .btn-close-banner { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }

    .emoji-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .emoji-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--bg);
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      line-height: 1;
    }
    .emoji-btn.selected {
      border-color: var(--green);
      background: var(--green-light);
      transform: scale(1.12);
    }

    .reminder-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      user-select: none;
    }
    .reminder-row.active { color: var(--green); }
    .med-card.warn .reminder-row.active { color: var(--orange); }
    .med-card.danger .reminder-row.active { color: var(--red); }
    .reminder-row .bell { font-size: 13px; line-height: 1; }
    .reminder-edit {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
    .reminder-edit.open { display: flex; }
    .reminder-edit input[type="time"] {
      flex: 1;
      font-size: 13px;
      padding: 7px 10px;
      min-width: 0;
    }
    .btn-reminder-save {
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 11px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-reminder-clear {
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 9px;
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .field-note {
      text-transform: none;
      font-weight: 500;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="avatar">💊</div>
    <div class="app-title">MyPillbox</div>
  </div>
  <div class="header-right">
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="nl" onclick="setLang('nl')">NL</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    </div>
    <div class="date-chip" id="dateDisplay"></div>
  </div>
</header>

<main>
  <div class="install-banner hidden" id="installBanner">
    <span id="installBannerText"></span>
    <button class="btn-install" id="installBtn"></button>
    <button class="btn-close-banner" id="closeBanner">×</button>
  </div>

  <div class="section-title" id="medsTitle"></div>
  <div class="med-list" id="cards">
    <div class="empty" id="emptyState">
      <span class="empty-icon">🌿</span>
      <p id="emptyText"></p>
    </div>
  </div>

  <div class="add-card">
    <div class="section-title" id="addMedTitle"></div>
    <div class="form-row">
      <div class="field-label" id="labelMedName"></div>
      <input type="text" id="medName" maxlength="40">
    </div>
    <div class="form-row">
      <div class="field-label" id="labelIcon"></div>
      <div class="emoji-row" id="emojiPicker"></div>
    </div>
    <div class="form-grid-2 form-row">
      <div>
        <div class="field-label" id="labelTotalDoses"></div>
        <input type="number" id="medDoses" min="1" max="9999">
      </div>
      <div>
        <div class="field-label" id="labelPerDay"></div>
        <input type="number" id="medPerDay" value="1" min="1" max="10">
      </div>
    </div>
    <div class="form-row">
      <div class="field-label" id="labelWarn"></div>
      <input type="number" id="medWarn" value="7" min="1" max="60">
    </div>
    <div class="form-row">
      <div class="field-label" id="labelReminder"></div>
      <input type="time" id="medReminder">
    </div>
    <button class="btn-add" id="btnAdd" onclick="addMed()"></button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
  // ── Vertalingen ────────────────────────────────────────────────────────────
  const T = {
    nl: {
      installBanner:    '📲 Voeg toe aan startscherm',
      install:          'Installeren',
      myMeds:           'Jouw medicatie',
      emptyText:        'Nog geen medicatie.<br>Voeg je eerste toe hieronder.',
      addMed:           'Medicatie toevoegen',
      medName:          'Naam medicatie',
      medNamePh:        'bijv. Ibuprofen',
      icon:             'Icoon',
      totalDoses:       'Totaal dosissen',
      dosesPh:          'bijv. 30',
      perDayLabel:      'Dosissen per dag',
      warnDays:         'Waarschuw bij ≤ dagen over',
      reminder:         'Dagelijkse herinnering',
      optional:         '(optioneel)',
      addBtn:           'Medicatie toevoegen',
      perDayCard:       n => `${n}× per dag`,
      daysLeft:         n => `${n} dag${n !== 1 ? 'en' : ''} over`,
      addReminder:      'Herinnering instellen',
      doses:            'dosissen',
      save:             'Opslaan',
      clear:            'Wissen',
      refillTitle:      'Aanvullen',
      takeOneTitle:     'Neem één',
      deleteTitle:      'Verwijderen',
      enterName:        'Vul een naam in',
      enterDoses:       'Vul het aantal dosissen in',
      added:            name => `${name} toegevoegd ✓`,
      refillPrompt:     name => `Hoeveel dosissen toevoegen aan ${name}?`,
      dosesAdded:       n => `+${n} dosissen toegevoegd`,
      removePrompt:     name => `${name} verwijderen?`,
      selectTime:       'Selecteer een tijdstip',
      reminderSet:      time => `Herinnering ingesteld voor ${time}`,
      reminderCleared:  'Herinnering verwijderd',
      notifNone:        'Meldingen worden niet ondersteund',
      notifBlocked:     'Meldingen geblokkeerd — schakel in via browserinstellingen',
      notifDenied:      'Toestemming voor meldingen geweigerd',
      notifTitle:       name => `Tijd om ${name} te nemen`,
      notifBody:        (emoji, n) => `${emoji} Nog ${n} dosis${n !== 1 ? 's' : ''} over`,
      dateLocale:       'nl-BE',
    },
    en: {
      installBanner:    '📲 Add to your home screen',
      install:          'Install',
      myMeds:           'Your medications',
      emptyText:        'No medications yet.<br>Add your first one below.',
      addMed:           'Add medication',
      medName:          'Medication name',
      medNamePh:        'e.g. Ibuprofen',
      icon:             'Icon',
      totalDoses:       'Total doses',
      dosesPh:          'e.g. 30',
      perDayLabel:      'Doses per day',
      warnDays:         'Warn when ≤ days left',
      reminder:         'Daily reminder',
      optional:         '(optional)',
      addBtn:           'Add medication',
      perDayCard:       n => `${n}× per day`,
      daysLeft:         n => `${n} day${n !== 1 ? 's' : ''} left`,
      addReminder:      'Add reminder',
      doses:            'doses',
      save:             'Save',
      clear:            'Clear',
      refillTitle:      'Refill',
      takeOneTitle:     'Take one',
      deleteTitle:      'Delete',
      enterName:        'Please enter a name',
      enterDoses:       'Please enter number of doses',
      added:            name => `${name} added ✓`,
      refillPrompt:     name => `How many doses to add to ${name}?`,
      dosesAdded:       n => `+${n} doses added`,
      removePrompt:     name => `Remove ${name}?`,
      selectTime:       'Please select a time',
      reminderSet:      time => `Reminder set for ${time}`,
      reminderCleared:  'Reminder removed',
      notifNone:        'Notifications not supported',
      notifBlocked:     'Notifications blocked — enable in browser settings',
      notifDenied:      'Notification permission denied',
      notifTitle:       name => `Time to take ${name}`,
      notifBody:        (emoji, n) => `${emoji} ${n} dose${n !== 1 ? 's' : ''} remaining`,
      dateLocale:       'en-GB',
    },
  };

  // ── Taal ───────────────────────────────────────────────────────────────────
  let lang = localStorage.getItem('medtracker_lang') || 'nl';

  function t(key, ...args) {
    const val = T[lang][key];
    return typeof val === 'function' ? val(...args) : val;
  }

  function setLang(l) {
    lang = l;
    localStorage.setItem('medtracker_lang', l);
    document.documentElement.lang = l;
    applyLang();
    render();
  }

  function applyLang() {
    document.getElementById('installBannerText').textContent  = t('installBanner');
    document.getElementById('installBtn').textContent         = t('install');
    document.getElementById('medsTitle').textContent          = t('myMeds');
    document.getElementById('emptyText').innerHTML            = t('emptyText');
    document.getElementById('addMedTitle').textContent        = t('addMed');
    document.getElementById('labelMedName').textContent       = t('medName');
    document.getElementById('medName').placeholder            = t('medNamePh');
    document.getElementById('labelIcon').textContent          = t('icon');
    document.getElementById('labelTotalDoses').textContent    = t('totalDoses');
    document.getElementById('medDoses').placeholder           = t('dosesPh');
    document.getElementById('labelPerDay').textContent        = t('perDayLabel');
    document.getElementById('labelWarn').textContent          = t('warnDays');
    document.getElementById('labelReminder').innerHTML =
      `${t('reminder')} <span class="field-note">${t('optional')}</span>`;
    document.getElementById('btnAdd').innerHTML =
      `<span style="font-size:18px">+</span> ${t('addBtn')}`;
    document.getElementById('dateDisplay').textContent =
      new Date().toLocaleDateString(t('dateLocale'), { weekday: 'short', day: 'numeric', month: 'short' });
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
  }

  // ── Data ───────────────────────────────────────────────────────────────────
  let meds = [];
  let deferredPrompt = null;
  let selectedEmoji = '💊';
  const EMOJIS = ['💊','💧','⚪','💉','🔵','🟢','🟡','🩸','🔆','🧴','🍶'];

  function initEmojiPicker() {
    const picker = document.getElementById('emojiPicker');
    EMOJIS.forEach(emoji => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'emoji-btn' + (emoji === selectedEmoji ? ' selected' : '');
      btn.textContent = emoji;
      btn.addEventListener('click', () => {
        selectedEmoji = emoji;
        picker.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
      picker.appendChild(btn);
    });
  }

  function save() {
    localStorage.setItem('medtracker_v2', JSON.stringify(meds));
    syncToSW();
  }

  // Stuurt medicatiedata naar de service worker zodat hij kan notificeren
  // ook als de app op de achtergrond staat of gesloten is.
  async function syncToSW() {
    if (!('serviceWorker' in navigator)) return;
    try {
      const reg = await navigator.serviceWorker.ready;
      if (reg.active) reg.active.postMessage({ type: 'SYNC_MEDS', meds });
    } catch {}
  }

  // Registreert Periodic Background Sync (Chrome Android, PWA geïnstalleerd).
  async function registerPeriodicSync() {
    if (!('serviceWorker' in navigator)) return;
    try {
      const reg = await navigator.serviceWorker.ready;
      if (!('periodicSync' in reg)) return;
      await reg.periodicSync.register('check-reminders', { minInterval: 60 * 60 * 1000 });
    } catch {}
  }

  function load() {
    try { meds = JSON.parse(localStorage.getItem('medtracker_v2') || '[]'); }
    catch { meds = []; }
  }

  function applyDailyDeductions() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let changed = false;
    meds.forEach(m => {
      const last = m.lastDeducted ? new Date(m.lastDeducted) : null;
      if (!last) {
        m.lastDeducted = today.toISOString();
        changed = true;
        return;
      }
      last.setHours(0, 0, 0, 0);
      const missedDays = Math.floor((today - last) / 86400000);
      if (missedDays > 0) {
        m.doses = Math.max(0, m.doses - (m.perDay || 1) * missedDays);
        m.lastDeducted = today.toISOString();
        changed = true;
      }
    });
    if (changed) save();
  }

  function daysLeft(m) { return m.perDay > 0 ? Math.floor(m.doses / m.perDay) : 0; }

  function render() {
    const container = document.getElementById('cards');
    const empty = document.getElementById('emptyState');
    if (meds.length === 0) {
      container.innerHTML = '';
      container.appendChild(empty);
      return;
    }
    if (empty.parentNode) empty.parentNode.removeChild(empty);
    container.innerHTML = '';
    meds.forEach((med, i) => {
      const days = daysLeft(med);
      const warn = med.warn || 7;
      const cls = days === 0 ? 'danger' : days <= warn ? 'warn' : '';
      const pct = med.initialDoses > 0 ? Math.min(100, (med.doses / med.initialDoses) * 100) : 0;
      const emoji = med.emoji || '💊';
      const card = document.createElement('div');
      card.className = `med-card ${cls}`;
      const reminderActive = med.reminderTime ? ' active' : '';
      const bellIcon = med.reminderTime ? '🔔' : '🔕';
      const reminderLabel = med.reminderTime ? formatTime(med.reminderTime) : t('addReminder');
      card.innerHTML = `
        <div class="med-icon">${emoji}</div>
        <div class="med-body">
          <div class="med-name">${esc(med.name)}</div>
          <div class="med-sub">${t('perDayCard', med.perDay)} &nbsp;·&nbsp; <span class="highlight">${t('daysLeft', days)}</span></div>
          <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
          <div class="reminder-row${reminderActive}" onclick="toggleReminder(${i})">
            <span class="bell">${bellIcon}</span>
            <span class="reminder-label">${reminderLabel}</span>
          </div>
          <div class="reminder-edit" id="reminder-edit-${i}">
            <input type="time" id="reminder-time-${i}" value="${med.reminderTime || ''}">
            <button class="btn-reminder-save" onclick="saveReminder(${i})">${t('save')}</button>
            <button class="btn-reminder-clear" onclick="clearReminder(${i})">${t('clear')}</button>
          </div>
        </div>
        <div class="med-right">
          <div><div class="dose-badge">${med.doses}</div><div class="dose-label">${t('doses')}</div></div>
          <div class="card-actions">
            <button class="btn-icon plus" title="${t('refillTitle')}" onclick="refill(${i})">+</button>
            <button class="btn-icon minus" title="${t('takeOneTitle')}" onclick="takeOne(${i})">−</button>
            <button class="btn-icon del" title="${t('deleteTitle')}" onclick="deleteMed(${i})">✕</button>
          </div>
        </div>`;
      container.appendChild(card);
    });
  }

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function addMed() {
    const name = document.getElementById('medName').value.trim();
    const doses = parseInt(document.getElementById('medDoses').value);
    const perDay = parseInt(document.getElementById('medPerDay').value) || 1;
    const warn = parseInt(document.getElementById('medWarn').value) || 7;
    const reminder = document.getElementById('medReminder').value || null;
    if (!name) { toast(t('enterName')); return; }
    if (!doses || doses < 1) { toast(t('enterDoses')); return; }
    const emoji = selectedEmoji;
    const today = new Date().toDateString();
    meds.push({ name, doses, initialDoses: doses, perDay, warn, emoji, lastDeducted: today, reminderTime: reminder, lastReminderDate: null });
    save(); render();
    document.getElementById('medName').value = '';
    document.getElementById('medDoses').value = '';
    document.getElementById('medReminder').value = '';
    toast(t('added', name));
    if (reminder) requestNotifPermission();
  }

  function refill(i) {
    const extra = parseInt(prompt(t('refillPrompt', meds[i].name)) || '0');
    if (extra > 0) {
      meds[i].doses += extra;
      meds[i].initialDoses = Math.max(meds[i].initialDoses, meds[i].doses);
      save(); render();
      toast(t('dosesAdded', extra));
    }
  }

  function takeOne(i) {
    if (meds[i].doses > 0) { meds[i].doses--; save(); render(); }
  }

  function deleteMed(i) {
    if (confirm(t('removePrompt', meds[i].name))) { meds.splice(i, 1); save(); render(); }
  }

  function formatTime(time) {
    if (!time) return '';
    if (lang === 'nl') return time; // Nederland/België: 24-uursnotatie
    const [h, m] = time.split(':');
    const hour = parseInt(h);
    return `${hour % 12 || 12}:${m} ${hour >= 12 ? 'PM' : 'AM'}`;
  }

  function toggleReminder(i) {
    const el = document.getElementById(`reminder-edit-${i}`);
    if (el) el.classList.toggle('open');
  }

  async function saveReminder(i) {
    const timeInput = document.getElementById(`reminder-time-${i}`);
    if (!timeInput || !timeInput.value) { toast(t('selectTime')); return; }
    const granted = await requestNotifPermission();
    if (!granted) return;
    meds[i].reminderTime = timeInput.value;
    meds[i].lastReminderDate = null;
    save(); render();
    toast(t('reminderSet', formatTime(timeInput.value)));
  }

  function clearReminder(i) {
    meds[i].reminderTime = null;
    meds[i].lastReminderDate = null;
    save(); render();
    toast(t('reminderCleared'));
  }

  async function requestNotifPermission() {
    if (!('Notification' in window)) { toast(t('notifNone')); return false; }
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'denied') { toast(t('notifBlocked')); return false; }
    const result = await Notification.requestPermission();
    if (result !== 'granted') toast(t('notifDenied'));
    return result === 'granted';
  }

  function checkReminders() {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const now = new Date();
    const currentTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const today = now.toDateString();
    let changed = false;
    meds.forEach((m, i) => {
      if (!m.reminderTime || m.reminderTime !== currentTime) return;
      if (m.lastReminderDate === today) return;
      meds[i].lastReminderDate = today;
      changed = true;
      const n = new Notification(t('notifTitle', m.name), {
        body: t('notifBody', m.emoji, m.doses),
        icon: '/icon.svg',
        tag: `medtracker-${m.name}`,
      });
      n.onclick = () => { window.focus(); n.close(); };
    });
    if (changed) save();
  }

  function toast(msg) {
    Toastify({
      text: msg,
      duration: 2200,
      gravity: 'bottom',
      position: 'center',
      stopOnFocus: false,
      style: {
        background: 'var(--text)',
        borderRadius: '24px',
        fontFamily: "'Nunito', sans-serif",
        fontSize: '13px',
        fontWeight: '700',
        padding: '10px 22px',
        boxShadow: '0 4px 16px rgba(0,0,0,0.18)',
      },
    }).showToast();
  }

  // ── Events ─────────────────────────────────────────────────────────────────
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferredPrompt = e;
    document.getElementById('installBanner').classList.remove('hidden');
  });
  document.getElementById('installBtn').addEventListener('click', () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installBanner').classList.add('hidden');
      });
    }
  });
  document.getElementById('closeBanner').addEventListener('click', () => {
    document.getElementById('installBanner').classList.add('hidden');
  });
  document.getElementById('medDoses').addEventListener('keydown', e => { if (e.key === 'Enter') addMed(); });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { applyDailyDeductions(); render(); }
  });

  // ── Opstarten ──────────────────────────────────────────────────────────────
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }

  load();
  applyDailyDeductions();
  initEmojiPicker();
  applyLang();   // teksten + datumweergave instellen
  render();
  setInterval(checkReminders, 30000);
  checkReminders();
  syncToSW();
  registerPeriodicSync();
</script>
</body>
</html>
